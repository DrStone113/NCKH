name: health_app
description: Ứng dụng quản lý sức khỏe cá nhân
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  
  # HTTP & API
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  uuid: ^4.3.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
