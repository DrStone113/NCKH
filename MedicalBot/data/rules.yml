version: "3.1"

rules:
- rule: Respond to greet
  steps:
  - intent: greet
  - action: utter_greet

- rule: Respond to goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Handle emergency always
  steps:
  - intent: emergency
  - action: action_emergency_alert

- rule: Handle NLU fallback
  steps:
  - intent: nlu_fallback
  - action: utter_ask_rephrase
