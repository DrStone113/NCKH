version: "3.1"

intents:
  - ask_health_advice
  - ask_nutrition
  - ask_exercise
  - emergency
  - greet
  - goodbye
  - nlu_fallback

entities:
  - food_item
  - exercise_type
  - symptom

slots:
  food_item:
    type: text
    mappings:
      - type: from_entity
        entity: food_item
  exercise_type:
    type: text
    mappings:
      - type: from_entity
        entity: exercise_type

responses:
  utter_greet:
    - text: "Xin chào! 👋 Tôi là trợ lý sức khỏe AI. Tôi có thể giúp bạn tư vấn sức khỏe, dinh dưỡng và bài tập. Hãy đặt câu hỏi nhé!"
  utter_goodbye:
    - text: "Tạm biệt! Chúc bạn sức khỏe tốt. Hãy nhớ tham vấn bác sĩ khi cần thiết! 😊"
  utter_fallback:
    - text: "Xin lỗi, tôi chưa hiểu câu hỏi của bạn. Bạn có thể hỏi về sức khỏe, dinh dưỡng hoặc bài tập thể dục."
  utter_ask_rephrase:
    - text: "Bạn có thể diễn đạt lại câu hỏi không? Tôi chưa hiểu rõ ý bạn muốn hỏi."
  utter_default:
    - text: "Xin lỗi, tôi không thể xử lý yêu cầu này. Vui lòng thử lại hoặc tham vấn bác sĩ chuyên khoa."

actions:
  - action_health_advice
  - action_nutrition_info
  - action_exercise_info
  - action_emergency_alert
  - action_default_fallback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
