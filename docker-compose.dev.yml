services:
  fastapi_backend:
    # Reuse the verified Python 3.11 dependency image while serving the current
    # working tree. This avoids rebuilding a multi-GB image for source edits.
    image: nckh_backend:d212
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/backend:/app
      - ./apps/backend/data:/app/data:ro
