services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend - Flutter Web App (Nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  flutter_web:
    image: health_frontend_image:latest
    build: 
      context: ./apps/mobile
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=${API_BASE_URL}
    container_name: health_frontend
    ports:
      - "80:80"
    depends_on:
      - fastapi_backend
    volumes:
      - ./apps/mobile/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - ai_net

  # ═══════════════════════════════════════════════════════════════════════════
  # FastAPI Backend - AI Health Assistant
  # ═══════════════════════════════════════════════════════════════════════════
  fastapi_backend:
    image: health_backend_image:latest
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: health_backend
    ports:
      - "8080:8000"
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - HEAVY_LLM_MODEL=${HEAVY_LLM_MODEL}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - HEAVY_LLM_REASONING_EFFORT=${HEAVY_LLM_REASONING_EFFORT:-}
      - LLM_SIMPLE_HISTORY_TURNS=${LLM_SIMPLE_HISTORY_TURNS:-12}
      - LLM_COMPLEX_HISTORY_TURNS=${LLM_COMPLEX_HISTORY_TURNS:-24}
      - SCOPE_CLASSIFIER_MODEL=${SCOPE_CLASSIFIER_MODEL:-chr/charm/qwen3.8-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - MAX_HISTORY_TURNS=${MAX_HISTORY_TURNS}
      - RAG_TOP_K=${RAG_TOP_K}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD}
      - WGER_BASE_URL=${WGER_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HF_HUB_DISABLE_XET=1
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface/sentence_transformers
    volumes:
      - ./apps/backend/data:/app/data:ro  # Read-only data
      - backend_logs:/app/logs
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai_net


  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL with pgvector - Vector Database
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-health_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./apps/backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health} -d ${POSTGRES_DB:-health_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_net

  # ═══════════════════════════════════════════════════════════════════════════
  # Data Loader - One-time setup (run with --profile init)
  # ═══════════════════════════════════════════════════════════════════════════
  data_loader:
    image: health_backend_image:latest
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: health_data_loader
    command: python scripts/load_dataset.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./apps/backend/data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - init
    networks:
      - ai_net

  # ═══════════════════════════════════════════════════════════════════════════
  # Wger Sync - Sync exercise data (run with --profile init)
  # ═══════════════════════════════════════════════════════════════════════════
  wger_sync:
    image: health_backend_image:latest
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: health_wger_sync
    command: python -m scripts.sync_wger
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - WGER_BASE_URL=${WGER_BASE_URL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./apps/backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - init
    networks:
      - ai_net

  # ═══════════════════════════════════════════════════════════════════════════
  # Cloudflare Tunnel - Expose to internet (run with --profile production)
  # ═══════════════════════════════════════════════════════════════════════════
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: health_cloudflared
    command: tunnel --no-autoupdate run --token $${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - fastapi_backend
    restart: unless-stopped
    networks:
      - ai_net
    profiles:
      - production

volumes:
  pg_data:
    driver: local
  backend_logs:
    driver: local
  hf_cache:
    driver: local

networks:
  ai_net:
    driver: bridge
