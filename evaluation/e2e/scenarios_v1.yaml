- scenario_id: E2E-05
  name: plan_save_reconnect_idempotency
  qualification_mode: REAL_AUTHENTICATED_NO_MOCKS
  requires: *id001
  evidence_to_capture: *id002
  steps:
  - Sign in
  - Generate and preview a Plan
  - Save the exact preview through the Plan revision detail
  - Recreate the authenticated application session before retrying the REST save request
  - Repeat the same exact save from a second independent browser session using the same action identity
  - Reload Plan Library and open the exact revision
  assertions:
  - Only one revision is persisted
  - Retry returns the same committed revision identity and content hash
  - Exact target hash remains unchanged
  - Persisted state remains readable after reconnect
  notes: >-
    The original scenario assumed WebSocket/ALREADY_EXECUTED semantics that
    are not part of the final Plan V2 REST contract. This scenario preserves
    the intended reconnect/retry idempotency invariant with the exact REST
    save action identity.
  status: DEFINED_NOT_EXECUTED
