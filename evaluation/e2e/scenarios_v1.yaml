  name: meal_recommendation_no_write
  qualification_mode: REAL_AUTHENTICATED_NO_MOCKS
  requires: &id001
  - Flutter Web
  - Firebase Auth token
  - backend
  - PostgreSQL
  evidence_to_capture: &id002
  - browser trace
  - backend request ids
  - database readback
  - screenshots
  steps:
  - Sign in as a fresh test user
  - Complete required profile fields
  - Ask for a dinner suggestion
  - Reload the app
  assertions:
  - Recommendation uses authenticated profile
  - No meal observation row is created
  - Chat state restores without converting suggestion to actual intake
  status: DEFINED_NOT_EXECUTED
